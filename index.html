/* =========================================================
   14) WORLD
   ========================================================= */
class World {
  constructor(levelData) {
    this.name = levelData.name;
    this.subtitle = levelData.subtitle;
    this.bg = levelData.bg;
    this.width = levelData.width;
    this.height = levelData.height;
    this.spawn = levelData.spawn;
    this.platforms = levelData.platforms;
    this.anchors = levelData.anchors;
    this.enemies = levelData.enemies;
    this.collectibles = levelData.collectibles;
    this.hazards = levelData.hazards;
    this.enemyProjectiles = levelData.enemyProjectiles || [];
    this.exit = levelData.exit;
    this.boss = levelData.boss;
    this.dialogue = levelData.dialogue || [];
    this.needShards = levelData.needShards || 0;
    this.shardsCollected = 0;
    this.bgTime = 0;
  }
  update(player) {
    this.bgTime++;
    for (const a of this.anchors) a.update();
    for (const h of this.hazards) h.update();
    for (const c of this.collectibles) c.update();
    // projectiles
    for (let i=this.enemyProjectiles.length-1;i>=0;i--) {
      this.enemyProjectiles[i].update(player, this.platforms);
      if (this.enemyProjectiles[i].dead) this.enemyProjectiles.splice(i,1);
    }
    // enemies
    for (const e of this.enemies) e.update(player, this.platforms);
    // boss
    if (this.boss && !this.boss.dead) this.boss.update(player, this.platforms);
    // hazards
    for (const h of this.hazards) h.checkCollision(player);
    // collectibles pickup
    for (let i=this.collectibles.length-1;i>=0;i--) {
      const c = this.collectibles[i];
      if (dist(player.x, player.y - 25, c.x, c.y) < 30) {
        if (c.type === 'copper') { player.copper++; audio.sfxPickup(); }
        else if (c.type === 'papyrus') { player.papyrus++; audio.sfxPickup(); }
        else if (c.type === 'amulet') { player.amulets++; audio.sfxPickup(); player.heal(1); }
        else if (c.type === 'shard') {
          player.shards++; this.shardsCollected++;
          audio.sfxShard();
          camera.addShake(6);
          particles.burst(c.x, c.y, 30, {color:'#80d0ff', speedMin:2, speedMax:8, life:50});
        }
        particles.burst(c.x, c.y, 8, {color:'#f0e0a0', speedMin:1, speedMax:4, life:25});
        this.collectibles.splice(i,1);
      }
    }
  }
  draw(ctx) {
    // background
    drawBackground(ctx, this.bg, camera.x, camera.y, this.bgTime);
    // hazards
    for (const h of this.hazards) h.draw(ctx);
    // platforms
    for (const p of this.platforms) p.draw(ctx);
    // anchors
    for (const a of this.anchors) a.draw(ctx);
    // collectibles
    for (const c of this.collectibles) c.draw(ctx);
    // exit portal
    if (this.exit) this.drawExit(ctx);
    // enemies
    for (const e of this.enemies) e.draw(ctx);
    // boss
    if (this.boss) this.boss.draw(ctx);
    // projectiles
    for (const p of this.enemyProjectiles) p.draw(ctx);
  }
  drawExit(ctx) {
    const e = this.exit;
    const pulse = 0.6 + Math.sin(Date.now()*0.003) * 0.4;
    ctx.save();
    ctx.fillStyle = `rgba(120,220,255,${0.2*pulse})`;
    ctx.fillRect(e.x - 20, e.y - 20, e.w + 40, e.h + 40);
    ctx.fillStyle = `rgba(60,180,255,${0.4*pulse})`;
    ctx.fillRect(e.x, e.y, e.w, e.h);
    ctx.strokeStyle = `rgba(180,240,255,${0.8*pulse})`;
    ctx.lineWidth = 3;
    ctx.strokeRect(e.x, e.y, e.w, e.h);
    // ankh
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(e.x + e.w/2, e.y + e.h/2 - 10, 12, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.x + e.w/2, e.y + e.h/2 + 2);
    ctx.lineTo(e.x + e.w/2, e.y + e.h/2 + 25);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.x + e.w/2 - 15, e.y + e.h/2 + 8);
    ctx.lineTo(e.x + e.w/2 + 15, e.y + e.h/2 + 8);
    ctx.stroke();
    ctx.restore();
  }
}

/* =========================================================
   15) BACKGROUNDS (procedural art)
   ========================================================= */
function drawSkyGradient(ctx, colors, y0, y1) {
  const grd = ctx.createLinearGradient(0, y0, 0, y1);
  for (let i=0;i<colors.length;i++) {
    grd.addColorStop(i/(colors.length-1), colors[i]);
  }
  ctx.fillStyle = grd;
  ctx.fillRect(0, y0, W, y1-y0);
}

function drawSunMoon(ctx, x, y, color, r, glowColor) {
  ctx.save();
  // glow
  const grd = ctx.createRadialGradient(x, y, r*0.5, x, y, r*4);
  grd.addColorStop(0, glowColor);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(x, y, r*4, 0, Math.PI*2);
  ctx.fill();
  // body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawPyramid(ctx, x, y, w, h, color, shade) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w/2, y - h);
  ctx.lineTo(x + w, y);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = shade;
  ctx.beginPath();
  ctx.moveTo(x + w/2, y - h);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w/2, y);
  ctx.closePath();
  ctx.fill();
}

function drawBackground(ctx, type, camX, camY, time) {
  if (type === 'giza') {
    // sky
    drawSkyGradient(ctx, COLORS.sky_day, 0, H);
    // sun
    drawSunMoon(ctx, W*0.75, H*0.25 - camY*0.05, '#fff6c0', 60, 'rgba(255,240,180,0.5)');
    // far pyramids
    const px = -camX * 0.1;
    drawPyramid(ctx, px + 100, 400 - camY*0.05, 400, 300, '#b8a070', '#8a7050');
    drawPyramid(ctx, px + 500, 420 - camY*0.05, 500, 380, '#c8b080', '#a08060');
    drawPyramid(ctx, px + 1000, 400 - camY*0.05, 400, 300, '#b8a070', '#8a7050');
    // mid pyramids
    const px2 = -camX * 0.25;
    drawPyramid(ctx, px2 + 200, 500 - camY*0.1, 350, 260, '#d0b880', '#a89060');
    drawPyramid(ctx, px2 + 800, 520 - camY*0.1, 450, 340, '#d8c090', '#b8a070');
    // dunes
    const px3 = -camX * 0.4;
    ctx.fillStyle = '#d4a868';
    ctx.beginPath();
    ctx.moveTo(0, 600 - camY*0.15);
    ctx.quadraticCurveTo(W*0.3, 550 - camY*0.15, W*0.6, 620 - camY*0.15);
    ctx.quadraticCurveTo(W*0.9, 680 - camY*0.15, W, 640 - camY*0.15);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#c89858';
    ctx.beginPath();
    ctx.moveTo(0, 680 - camY*0.2);
    ctx.quadraticCurveTo(W*0.4, 640 - camY*0.2, W, 700 - camY*0.2);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();
  } else if (type === 'saqqara') {
    // underground
    drawSkyGradient(ctx, ['#1a0a08', '#2a1810', '#3a2015'], 0, H);
    // torch lights
    for (let i=0;i<8;i++) {
      const tx = (i * 400 - camX*0.3) % (W + 400) - 200;
      const flicker = Math.sin(time*0.1 + i)*0.3 + 0.7;
      const grd = ctx.createRadialGradient(tx, H*0.3, 10, tx, H*0.3, 200);
      grd.addColorStop(0, `rgba(255,180,60,${0.4*flicker})`);
      grd.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(tx-200, 0, 400, H);
      // torch holder
      ctx.fillStyle = '#5a3a10';
      ctx.fillRect(tx-3, H*0.28, 6, 30);
      ctx.fillStyle = `rgba(255,140,40,${flicker})`;
      ctx.beginPath();
      ctx.ellipse(tx, H*0.28, 8, 14, 0, 0, Math.PI*2);
      ctx.fill();
    }
    // pillars in back
    const px = -camX * 0.4;
    ctx.fillStyle = '#4a3018';
    for (let i=0;i<12;i++) {
      const x = px + i*350;
      ctx.fillRect(x, 100, 60, H - 100);
      // hieroglyphs
      ctx.fillStyle = '#6a4a20';
      for (let j=0;j<10;j++) {
        ctx.fillRect(x+10, 150 + j*60, 8, 8);
        ctx.fillRect(x+30, 160 + j*60, 6, 16);
        ctx.fillRect(x+42, 170 + j*60, 8, 6);
      }
      ctx.fillStyle = '#4a3018';
    }
  } else if (type === 'luxor') {
    // night sky
    drawSkyGradient(ctx, COLORS.sky_night, 0, H);
    // stars
    for (let i=0;i<100;i++) {
      const sx = ((i*137) % W) - camX*0.02;
      const sy = ((i*97) % (H*0.6));
      const tw = Math.sin(time*0.05 + i)*0.5 + 0.5;
      ctx.fillStyle = `rgba(255,255,255,${tw*0.8})`;
      ctx.fillRect(sx, sy, 2, 2);
    }
    // moon
    drawSunMoon(ctx, W*0.2 - camX*0.03, H*0.2, '#e0e8f0', 50, 'rgba(200,220,255,0.4)');
    // distant temple
    const px = -camX * 0.15;
    ctx.fillStyle = '#2a1a30';
    for (let i=0;i<8;i++) {
      const x = px + 100 + i*200;
      ctx.fillRect(x, 350, 60, 400);
      // capital
      ctx.fillRect(x-10, 340, 80, 20);
    }
    // mid temple
    const px2 = -camX * 0.3;
    ctx.fillStyle = '#1a0a20';
    for (let i=0;i<6;i++) {
      const x = px2 + 200 + i*280;
      ctx.fillRect(x, 500, 80, H);
      ctx.fillRect(x-15, 480, 110, 30);
      // glowing window
      ctx.fillStyle = 'rgba(255,180,60,0.3)';
      ctx.fillRect(x+30, 550, 20, 40);
      ctx.fillStyle = '#1a0a20';
    }
  } else if (type === 'aswan') {
    // day sky
    drawSkyGradient(ctx, COLORS.sky_day, 0, H*0.7);
    // sun
    drawSunMoon(ctx, W*0.8, H*0.15, '#fff6c0', 50, 'rgba(255,240,180,0.5)');
    // water
    ctx.fillStyle = '#3a7ab0';
    ctx.fillRect(0, H*0.55, W, H*0.45);
    // water shimmer
    for (let i=0;i<40;i++) {
      const x = ((i*73 - camX*0.2) % W);
      const y = H*0.6 + (i*23) % (H*0.4);
      const shim = Math.sin(time*0.05 + i)*0.5 + 0.5;
      ctx.fillStyle = `rgba(180,220,255,${shim*0.4})`;
      ctx.fillRect(x, y, 30, 2);
    }
    // palm silhouettes
    const px = -camX * 0.3;
    for (let i=0;i<6;i++) {
      const x = px + 150 + i*280;
      const y = H*0.55;
      ctx.fillStyle = '#1a3010';
      ctx.fillRect(x-3, y-120, 6, 120);
      // fronds
      for (let j=0;j<6;j++) {
        const ang = -Math.PI/2 + (j-2.5) * 0.5;
        ctx.beginPath();
        ctx.moveTo(x, y-120);
        ctx.quadraticCurveTo(
          x + Math.cos(ang)*40, y-120 + Math.sin(ang)*40,
          x + Math.cos(ang)*70, y-120 + Math.sin(ang)*70 + 20
        );
        ctx.lineTo(x + Math.cos(ang)*50, y-120 + Math.sin(ang)*50);
        ctx.closePath();
        ctx.fill();
      }
    }
    // distant island
    const px2 = -camX * 0.15;
    ctx.fillStyle = '#2a4060';
    ctx.beginPath();
    ctx.ellipse(px2 + 400, H*0.55, 200, 40, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#1a3050';
    ctx.fillRect(px2 + 380, H*0.5, 40, 40);
  } else if (type === 'abusimbel') {
    // dawn sky
    drawSkyGradient(ctx, COLORS.sky_dawn, 0, H);
    // rising sun
    drawSunMoon(ctx, W*0.5, H*0.75 - camY*0.05, '#fff0a0', 100, 'rgba(255,200,100,0.6)');
    // rays
    ctx.save();
    ctx.translate(W*0.5, H*0.75);
    for (let i=0;i<12;i++) {
      const a = (i/12) * Math.PI * 2 + time*0.001;
      ctx.fillStyle = `rgba(255,220,120,${0.15 + Math.sin(time*0.05 + i)*0.05})`;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a-0.1)*W, Math.sin(a-0.1)*W);
      ctx.lineTo(Math.cos(a+0.1)*W, Math.sin(a+0.1)*W);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    // temple silhouette
    const px = -camX * 0.2;
    ctx.fillStyle = '#3a1a10';
    ctx.fillRect(px + 100, 300, 700, 400);
    ctx.fillRect(px + 800, 300, 700, 400);
    // colossal statues (simplified)
    ctx.fillStyle = '#2a1008';
    for (let i=0;i<2;i++) {
      const x = px + 250 + i*900;
      ctx.fillRect(x, 400, 120, 300);
      // head
      ctx.fillRect(x + 20, 340, 80, 80);
      // crown
      ctx.fillRect(x + 30, 300, 60, 50);
    }
    // door
    ctx.fillStyle = '#1a0500';
    ctx.fillRect(px + 780, 500, 150, 200);
    // light beam through door
    const beam = 0.5 + Math.sin(time*0.02)*0.2;
    ctx.fillStyle = `rgba(255,220,120,${beam*0.4})`;
    ctx.beginPath();
    ctx.moveTo(px + 855, 600);
    ctx.lineTo(W*0.3, H);
    ctx.lineTo(W*0.7, H);
    ctx.closePath();
    ctx.fill();
  }
}

/* =========================================================
   16) UI / HUD / DIALOGUE
   ========================================================= */
class DialogueBox {
  constructor() {
    this.active = false;
    this.speaker = '';
    this.text = '';
    this.timer = 0;
    this.maxTimer = 0;
    this.displayText = '';
    this.charIndex = 0;
    this.charTimer = 0;
  }
  show(speaker, text, duration) {
    this.active = true;
    this.speaker = speaker;
    this.text = text;
    this.displayText = '';
    this.charIndex = 0;
    this.charTimer = 0;
    this.maxTimer = duration || 180;
    this.timer = this.maxTimer;
  }
  update() {
    if (!this.active) return;
    this.timer--;
    if (this.timer <= 0) { this.active = false; return; }
    this.charTimer++;
    if (this.charTimer > 2 && this.charIndex < this.text.length) {
      this.charIndex++;
      this.charTimer = 0;
      this.displayText = this.text.slice(0, this.charIndex);
    }
  }
  draw(ctx) {
    if (!this.active) return;
    const boxW = 900, boxH = 130;
    const x = (W - boxW)/2, y = H - boxH - 40;
    ctx.save();
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x+4, y+4, boxW, boxH);
    // bg
    const grd = ctx.createLinearGradient(x, y, x, y + boxH);
    grd.addColorStop(0, 'rgba(30,15,5,0.92)');
    grd.addColorStop(1, 'rgba(15,8,2,0.92)');
    ctx.fillStyle = grd;
    ctx.fillRect(x, y, boxW, boxH);
    // border
    ctx.strokeStyle = '#c8a040';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, boxW, boxH);
    // corner ornaments
    ctx.fillStyle = '#c8a040';
    ctx.fillRect(x, y, 10, 2);
    ctx.fillRect(x, y, 2, 10);
    ctx.fillRect(x + boxW - 10, y, 10, 2);
    ctx.fillRect(x + boxW - 2, y, 2, 10);
    ctx.fillRect(x, y + boxH - 2, 10, 2);
    ctx.fillRect(x, y + boxH - 10, 2, 10);
    ctx.fillRect(x + boxW - 10, y + boxH - 2, 10, 2);
    ctx.fillRect(x + boxW - 2, y + boxH - 10, 2, 10);
    // speaker
    ctx.font = 'bold 22px "Segoe UI", Tahoma, sans-serif';
    ctx.fillStyle = '#f0c060';
    ctx.textAlign = 'right';
    ctx.direction = 'rtl';
    ctx.fillText(this.speaker, x + boxW - 25, y + 32);
    // text
    ctx.font = '18px "Segoe UI", Tahoma, sans-serif';
    ctx.fillStyle = '#f0e0c0';
    ctx.textAlign = 'right';
    ctx.direction = 'rtl';
    // word wrap
    const maxW = boxW - 50;
    const words = this.displayText.split(' ');
    let line = '';
    let lineY = y + 65;
    for (const word of words) {
      const test = line + (line ? ' ' : '') + word;
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line, x + boxW - 25, lineY);
        line = word;
        lineY += 26;
        if (lineY > y + boxH - 20) break;
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, x + boxW - 25, lineY);
    // continue indicator
    if (this.charIndex >= this.text.length) {
      const blink = Math.sin(Date.now()*0.01) * 0.5 + 0.5;
      ctx.fillStyle = `rgba(240,200,100,${blink})`;
      ctx.beginPath();
      ctx.moveTo(x + boxW - 30, y + boxH - 20);
      ctx.lineTo(x + boxW - 20, y + boxH - 20);
      ctx.lineTo(x + boxW - 25, y + boxH - 12);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

class HUD {
  constructor() { this.shardFlash = 0; this.message = ''; this.messageTimer = 0; }
  showMessage(msg, dur=120) { this.message = msg; this.messageTimer = dur; }
  draw(ctx, player, world) {
    ctx.save();
    // health hearts
    const hx = 30, hy = 30;
    ctx.font = 'bold 16px "Segoe UI"';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    for (let i=0;i<player.maxHp;i++) {
      const filled = i < player.hp;
      const x = hx + i*32;
      // draw ankh-shaped health
      ctx.save();
      ctx.translate(x, hy);
      // glow
      if (filled) {
        ctx.fillStyle = `rgba(255,80,80,${0.4 + Math.sin(Date.now()*0.005 + i)*0.15})`;
        ctx.beginPath();
        ctx.arc(10, 10, 18, 0, Math.PI*2);
        ctx.fill();
      }
      // ankh shape
      ctx.strokeStyle = filled ? '#ff4040' : 'rgba(80,30,30,0.6)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(10, 6, 6, 0, Math.PI*2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(10, 12);
      ctx.lineTo(10, 24);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(2, 16);
      ctx.lineTo(18, 16);
      ctx.stroke();
      // fill
      if (filled) {
        ctx.fillStyle = '#ff6060';
        ctx.beginPath();
        ctx.arc(10, 6, 3, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    // shards
    ctx.font = 'bold 18px "Segoe UI"';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#80d0ff';
    ctx.fillText(`شظايا: ${player.shards}`, W - 30, 40);
    // collectibles row
    ctx.font = '15px "Segoe UI"';
    ctx.fillStyle = '#c87533';
    ctx.fillText(`نحاس: ${player.copper}`, W - 30, 68);
    ctx.fillStyle = '#e8d8a0';
    ctx.fillText(`بردي: ${player.papyrus}`, W - 30, 88);
    ctx.fillStyle = '#ffd860';
    ctx.fillText(`تمائم: ${player.amulets}`, W - 30, 108);
    // level name
    ctx.font = 'bold 16px "Segoe UI"';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(240,200,100,0.7)';
    ctx.fillText(world.name, 30, 70);
    ctx.font = '13px "Segoe UI"';
    ctx.fillStyle = 'rgba(200,170,120,0.5)';
    ctx.fillText(world.subtitle, 30, 90);
    // boss hp bar
    if (world.boss && !world.boss.dead) {
      const bw = 500, bh = 20;
      const bx = (W - bw)/2, by = 30;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx-2, by-2, bw+4, bh+4);
      ctx.fillStyle = '#2a0808';
      ctx.fillRect(bx, by, bw, bh);
      const hpPct = world.boss.hp / world.boss.maxHp;
      const grd = ctx.createLinearGradient(bx, 0, bx+bw, 0);
      grd.addColorStop(0, '#c03030');
      grd.addColorStop(1, '#e06060');
      ctx.fillStyle = grd;
      ctx.fillRect(bx, by, bw * hpPct, bh);
      ctx.strokeStyle = '#c8a040';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(bx, by, bw, bh);
      ctx.font = 'bold 16px "Segoe UI"';
      ctx.fillStyle = '#f0c060';
      ctx.textAlign = 'center';
      ctx.fillText(world.boss.name, W/2, by - 8);
    }
    // message
    if (this.messageTimer > 0) {
      this.messageTimer--;
      const alpha = Math.min(1, this.messageTimer / 30);
      ctx.globalAlpha = alpha;
      ctx.font = 'bold 22px "Segoe UI"';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#f0c060';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 6;
      ctx.fillText(this.message, W/2, H/2 - 100);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

   17) GAME
   ========================================================= */
const camera = new Camera();
const particles = new ParticleSystem();

class Game {
  constructor() {
    this.canvas = document.getElementById('game-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.state = 'menu'; // menu, playing, paused, levelComplete, gameOver, victory
    this.currentLevel = 0;
    this.world = null;
    this.player = null;
    this.dialogue = new DialogueBox();
    this.hud = new HUD();
    this.levelTransition = 0;
    this.transitioning = false;
    this.totalShards = 0;
    this.bossDefeated = false;
    this.titleTimer = 0;
    this.menuSelection = 0;
    this.levelStartTimer = 0;
    this.tutorialMessages = [];
    this.tutorialShown = false;
    this.startTime = 0;
    Input.init(this.canvas);
    this.loadLevel(0);
  }
  loadLevel(idx) {
    this.currentLevel = idx;
    let data;
    switch(idx) {
      case 0: data = buildLevel1(); break;
      case 1: data = buildLevel2(); break;
      case 2: data = buildLevel3(); break;
      case 3: data = buildLevel4(); break;
      case 4: data = buildLevel5(); break;
      default: return;
    }
    this.world = new World(data);
    this.player = new Player(data.spawn.x, data.spawn.y);
    // preserve collected stats
    if (this.savedStats) {
      this.player.copper = this.savedStats.copper;
      this.player.papyrus = this.savedStats.papyrus;
      this.player.amulets = this.savedStats.amulets;
      this.player.shards = this.savedStats.shards;
      this.player.maxHp = this.savedStats.maxHp;
      this.player.hp = this.savedStats.maxHp;
      this.player.hasDoubleJump = this.savedStats.hasDoubleJump;
      this.player.speedBoost = this.savedStats.speedBoost;
    }
    this.savedStats = null;
    this.bossDefeated = false;
    this.levelStartTimer = 120;
    this.state = 'playing';
    this.transitioning = true;
    this.levelTransition = 0;
    this.tutorialShown = false;
    this.tutorialMessages = [];
    particles.clear();
    camera.x = this.player.x - W/2;
    camera.y = this.player.y - H/2;
    // trigger dialogue
    if (this.world.dialogue.length > 0) {
      const d = this.world.dialogue[0];
      setTimeout(() => this.dialogue.show(d.speaker, d.text, d.time), 500);
    }
    // tutorial tips for level 1
    if (idx === 0) {
      setTimeout(() => this.hud.showMessage('اضغط A/D للحركة، Space للقفز', 180), 1500);
    }
  }
  onBossDefeated(boss) {
    this.bossDefeated = true;
    audio.sfxShard();
    camera.addShake(20);
    this.hud.showMessage('الزعيم اتغلب! الطريق فتح...', 240);
    // drop big shard
    if (this.world.boss) {
      const shard = new Collectible(boss.x, boss.y - 80, 'shard');
      this.world.collectibles.push(shard);
    }
  }
  saveStats() {
    if (!this.player) return;
    this.savedStats = {
      copper: this.player.copper,
      papyrus: this.player.papyrus,
      amulets: this.player.amulets,
      shards: this.player.shards,
      maxHp: this.player.maxHp,
      hasDoubleJump: this.player.hasDoubleJump,
      speedBoost: this.player.speedBoost,
    };
  }
  update() {
    // menu input
    if (this.state === 'menu') {
      this.titleTimer++;
      if (Input.wasPressed('Space') || Input.wasPressed('Enter') || Input.mouse.pressed) {
        audio.init(); audio.resume(); audio.sfxMenu();
        this.state = 'playing';
        this.loadLevel(0);
      }
      return;
    }
    if (this.state === 'paused') {
      if (Input.wasPressed('Escape')) { this.state = 'playing'; }
      return;
    }
    if (this.state === 'gameOver') {
      if (Input.wasPressed('Space') || Input.wasPressed('Enter')) {
        this.state = 'menu';
      }
      return;
    }
    if (this.state === 'victory') {
      if (Input.wasPressed('Space') || Input.wasPressed('Enter')) {
        this.state = 'menu';
      }
      return;
    }
    if (this.state === 'levelComplete') {
      this.levelTransition++;
      if (this.levelTransition > 60) {
        if (this.currentLevel < 4) {
          this.saveStats();
          this.loadLevel(this.currentLevel + 1);
        } else {
          this.state = 'victory';
        }
      }
      return;
    }
    if (this.state !== 'playing') return;

    // pause
    if (Input.wasPressed('Escape')) {
      this.state = 'paused';
      return;
    }

    this.levelStartTimer = Math.max(0, this.levelStartTimer - 1);
    if (this.transitioning) {
      this.levelTransition++;
      if (this.levelTransition > 40) this.transitioning = false;
    }

    // update player
    this.player.update(this.world, this.world.platforms, this.world.anchors);

    // player death
    if (this.player.dead && this.player.deadTimer <= 0) {
      this.state = 'gameOver';
      return;
    }

    // update world
    this.world.update(this.player);

    // camera follow
    camera.follow(this.player.x, this.player.y - 30, this.world.width, this.world.height);
    camera.update();

    // particles
    particles.update();

    // dialogue
    this.dialogue.update();

    // check exit
    if (this.world.exit && this.world.boss && this.world.boss.dead) {
      const pb = {x:this.player.x - 14, y:this.player.y - 50, w:28, h:50};
      if (aabb(pb, this.world.exit)) {
        audio.sfxShard();
        this.state = 'levelComplete';
        this.levelTransition = 0;
      }
    }
    // level without boss (level 1) exit unlocked immediately after collecting a shard? For level 1, no boss. Exit always available.
    if (this.world.exit && !this.world.boss) {
      const pb = {x:this.player.x - 14, y:this.player.y - 50, w:28, h:50};
      if (aabb(pb, this.world.exit)) {
        audio.sfxShard();
        this.state = 'levelComplete';
        this.levelTransition = 0;
      }
    }
  }
  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, W, H);
    if (this.state === 'menu') {
      this.drawMenu(ctx);
      return;
    }
    if (!this.world) return;
    // world
    ctx.save();
    camera.apply(ctx);
    this.world.draw(ctx);
    // player
    if (this.player) this.player.draw(ctx);
    // particles
    particles.draw(ctx);
    ctx.restore();

    // UI
    this.hud.draw(ctx, this.player, this.world);
    this.dialogue.draw(ctx);

    // level transition overlay
    if (this.transitioning) {
      const a = Math.min(1, this.levelTransition / 40);
      ctx.fillStyle = `rgba(0,0,0,${a})`;
      ctx.fillRect(0, 0, W, H);
      if (this.levelTransition > 10) {
        ctx.save();
        ctx.globalAlpha = a;
        ctx.font = 'bold 48px "Segoe UI"';
        ctx.fillStyle = '#f0c060';
        ctx.textAlign = 'center';
        ctx.direction = 'rtl';
        ctx.fillText(this.world.name, W/2, H/2);
        ctx.font = '20px "Segoe UI"';
        ctx.fillStyle = 'rgba(200,170,100,0.8)';
        ctx.fillText(this.world.subtitle, W/2, H/2 + 40);
        ctx.restore();
      }
    }

    // pause overlay
    if (this.state === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, W, H);
      ctx.font = 'bold 48px "Segoe UI"';
      ctx.fillStyle = '#f0c060';
      ctx.textAlign = 'center';
      ctx.direction = 'rtl';
      ctx.fillText('إيقاف مؤقت', W/2, H/2 - 20);
      ctx.font = '20px "Segoe UI"';
      ctx.fillText('اضغط Esc للمتابعة', W/2, H/2 + 30);
    }

    // level complete overlay
    if (this.state === 'levelComplete') {
      const a = Math.min(1, this.levelTransition / 40);
      ctx.fillStyle = `rgba(0,0,0,${a})`;
      ctx.fillRect(0, 0, W, H);
      if (this.levelTransition > 20) {
        ctx.save();
        ctx.globalAlpha = a;
        ctx.font = 'bold 42px "Segoe UI"';
        ctx.fillStyle = '#f0c060';
        ctx.textAlign = 'center';
        ctx.direction = 'rtl';
        ctx.fillText('الفصل اكتمل!', W/2, H/2 - 40);
        ctx.font = '22px "Segoe UI"';
        ctx.fillStyle = '#c8a870';
        ctx.fillText('شظايا: ' + this.player.shards + ' / 4', W/2, H/2 + 20);
        ctx.restore();
      }
    }

    // game over
    if (this.state === 'gameOver') {
      ctx.fillStyle = 'rgba(20,0,0,0.85)';
      ctx.fillRect(0, 0, W, H);
      ctx.font = 'bold 56px "Segoe UI"';
      ctx.fillStyle = '#d04040';
      ctx.textAlign = 'center';
      ctx.direction = 'rtl';
      ctx.fillText('الظل غلبك', W/2, H/2 - 40);
      ctx.font = '22px "Segoe UI"';
      ctx.fillStyle = '#f0c060';
      ctx.fillText('اضغط Space للمحاولة تاني', W/2, H/2 + 20);
    }

    // victory
    if (this.state === 'victory') {
      ctx.fillStyle = 'rgba(20,10,0,0.9)';
      ctx.fillRect(0, 0, W, H);
      ctx.font = 'bold 60px "Segoe UI"';
      ctx.fillStyle = '#ffd860';
      ctx.textAlign = 'center';
      ctx.direction = 'rtl';
      ctx.fillText('قلب رع اتنور!', W/2, H/2 - 60);
      ctx.font = '26px "Segoe UI"';
      ctx.fillStyle = '#f0c060';
      ctx.fillText('النيل رجع يفيض... والظل اتغلب.', W/2, H/2);
      ctx.font = '20px "Segoe UI"';
      ctx.fillStyle = '#c8a870';
      ctx.fillText('شظايا: ' + this.player.shards + ' / 4', W/2, H/2 + 60);
      ctx.fillText('اضغط Space للرجوع للقائمة', W/2, H/2 + 100);
    }
  }
  drawMenu(ctx) {
    // background
    drawBackground(ctx, 'giza', this.titleTimer * 0.3, 0, this.titleTimer);
    // dark overlay
    ctx.fillStyle = 'rgba(10,5,20,0.6)';
    ctx.fillRect(0, 0, W, H);
    // title
    ctx.save();
    const bob = Math.sin(this.titleTimer * 0.03) * 4;
    ctx.font = 'bold 96px "Segoe UI", Tahoma';
    ctx.textAlign = 'center';
    ctx.direction = 'ltr';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText('HAAK', W/2 + 4, 220 + bob + 4);
    const grd = ctx.createLinearGradient(W/2 - 200, 0, W/2 + 200, 0);
    grd.addColorStop(0, '#c8a040');
    grd.addColorStop(0.5, '#f0e080');
    grd.addColorStop(1, '#c8a040');
    ctx.fillStyle = grd;
    ctx.fillText('HAAK', W/2, 220 + bob);
    // subtitle
    ctx.font = 'bold 42px "Segoe UI"';
    ctx.direction = 'rtl';
    ctx.fillStyle = '#e8b850';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 8;
    ctx.fillText('ظل الفرعون', W/2, 290 + bob);
    ctx.shadowBlur = 0;
    ctx.font = '18px "Segoe UI"';
    ctx.fillStyle = 'rgba(200,170,100,0.7)';
    ctx.fillText('نسخة مصر — من الأهرامات إلى أسوان', W/2, 325 + bob);
    // start prompt
    const blink = Math.sin(this.titleTimer * 0.08) * 0.5 + 0.5;
    ctx.font = 'bold 28px "Segoe UI"';
    ctx.fillStyle = `rgba(240,200,100,${0.4 + blink * 0.6})`;
    ctx.fillText('اضغط Space للبدء', W/2, 460);
    // controls
    ctx.font = '16px "Segoe UI"';
    ctx.fillStyle = 'rgba(200,180,140,0.6)';
    ctx.fillText('A/D حركة · Space قفز · الفأرة تصويب · J خطاف · E تفاعل', W/2, 560);
    ctx.font = '14px "Segoe UI"';
    ctx.fillStyle = 'rgba(180,160,120,0.5)';
    ctx.fillText('HAAK: ظل الفرعون — 5 فصول · خطاف · مترويدفانيا · زعماء', W/2, 600);
    // decorative ankhs
    for (let i=0;i<3;i++) {
      const ax = W*0.15 + i*W*0.35;
      const ay = 640;
      ctx.strokeStyle = `rgba(240,200,100,${0.3 + Math.sin(this.titleTimer*0.04 + i)*0.2})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(ax, ay, 20, 0, Math.PI*2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ax, ay + 20);
      ctx.lineTo(ax, ay + 60);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ax - 30, ay + 35);
      ctx.lineTo(ax + 30, ay + 35);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* =========================================================
   18) MAIN LOOP
   ========================================================= */
const game = new Game();
let lastTime = performance.now();
let accumulator = 0;
const STEP = 1000 / TARGET_FPS;

function loop(now) {
  const delta = Math.min(now - lastTime, 100);
  lastTime = now;
  accumulator += delta;
  let steps = 0;
  while (accumulator >= STEP && steps < 5) {
    game.update();
    Input.endFrame();
    accumulator -= STEP;
    steps++;
  }
  game.draw();
  requestAnimationFrame(loop);
}

// init audio on first interaction
document.addEventListener('click', () => { audio.init(); audio.resume(); }, { once: true });
document.addEventListener('keydown', () => { audio.init(); audio.resume(); }, { once: true });

requestAnimationFrame(loop);

console.log('%cHAAK: ظل الفرعون — Loaded', 'color:#f0c060;font-size:20px;font-weight:bold');
console.log('%cنسخة مصر — 5 فصول · خطاف · مترويدفانيا', 'color:#c8a870;font-size:14px');
</script>
